<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A0E1A"/><stop offset="1" stop-color="#800020"/></linearGradient></defs>
  <style>
    .fl{animation:float 4s ease-in-out infinite}
    .cyc{opacity:0;animation:cyc 12s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes cyc{0%{opacity:0;transform:translateY(12px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-12px)}}
    .f{font:700 44px 'Courier New',Courier,monospace;fill:#FFFFFF}.ttl{font:700 22px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF}.s{font:700 34px 'Courier New',Courier,monospace;fill:#E8D3C4}.sm{font:600 16px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF;opacity:.92}
  </style>
  <rect x="3" y="3" width="794" height="214" rx="28" fill="url(#card)"/>
  <text x="400" y="44" text-anchor="middle" class="ttl">➗ because maths is pretty ➗</text>
<text x="400" y="128" text-anchor="middle" class="f cyc" style="animation-delay:0s">e^(iπ) + 1 = 0</text>
<text x="400" y="128" text-anchor="middle" class="f cyc" style="animation-delay:3s">a² + b² = c²</text>
<text x="400" y="128" text-anchor="middle" class="f cyc" style="animation-delay:6s">∑ 1/n² = π²/6</text>
<text x="400" y="128" text-anchor="middle" class="f cyc" style="animation-delay:9s">∫ e^(−x²) dx = √π</text>
  <text x="70" y="120" class="s fl">∑</text>
  <text x="130" y="170" class="s fl" style="animation-delay:.7s">π</text>
  <text x="690" y="120" class="s fl" style="animation-delay:1.2s">∫</text>
  <text x="735" y="170" class="s fl" style="animation-delay:1.9s">∞</text>
  <text x="400" y="196" text-anchor="middle" class="sm">the one thing that always makes sense</text>
</svg>

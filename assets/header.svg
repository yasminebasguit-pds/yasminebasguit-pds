<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A0E1A"/><stop offset="0.55" stop-color="#800020"/><stop offset="1" stop-color="#C9A18A"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="round"><rect width="900" height="360" rx="30"/></clipPath>
    <path id="heart" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z"/><path id="star" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z"/>
    <clipPath id="t1"><rect x="0" y="196" width="0" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.30;0.31;1" values="200;720;720;200;200"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="196" width="0" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.41;0.63;0.64;1" values="200;200;720;720;200;200"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="196" width="0" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.74;0.96;0.97;1" values="200;200;720;720;200;200"/></rect></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2E0F14" flood-opacity="0.45"/></filter>
  </defs>
  <style>
    .rise{animation:rise 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 3.2s ease-in-out infinite}
    .fall{animation:fall 8s linear infinite;transform-box:fill-box;transform-origin:center}
    .beat{animation:beat 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .shine{animation:shine 3s ease-in-out infinite}
    .ring{animation:ring 2.4s ease-in-out infinite}
    @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.95}100%{transform:translateY(-380px) scale(1.15);opacity:0}}
    @keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes fall{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(440px) rotate(20deg);opacity:0}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    @keyframes shine{0%,100%{opacity:.15}50%{opacity:.6}}
    @keyframes ring{0%,100%{opacity:.35}50%{opacity:.9}}
    .title{font:700 62px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF}
    .sub{font:600 26px 'Courier New',Courier,monospace;fill:#FFFFFF}
    .tag{font:700 16px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF;letter-spacing:.5px}
    .tok{font:700 22px 'Courier New',Courier,monospace}
  </style>
  <g clip-path="url(#round)">
    <rect width="900" height="360" fill="url(#bg)"/>
    <circle cx="90" cy="60" r="130" fill="#FFFFFF" opacity=".08"/>
    <circle cx="820" cy="320" r="170" fill="#FFFFFF" opacity=".12"/>
<g transform="translate(50,380)"><g class="rise" fill="#FFFFFF" style="animation-delay:0s"><use href="#heart"/></g></g>
<g transform="translate(140,380)"><g class="rise" fill="#C9A18A" style="animation-delay:1.8s"><use href="#heart"/></g></g>
<g transform="translate(230,380)"><g class="rise" fill="#FFFFFF" style="animation-delay:3.4s"><use href="#heart"/></g></g>
<g transform="translate(330,380)"><g class="rise" fill="#E8D3C4" style="animation-delay:0.9s"><use href="#heart"/></g></g>
<g transform="translate(430,380)"><g class="rise" fill="#FFFFFF" style="animation-delay:4.6s"><use href="#heart"/></g></g>
<g transform="translate(530,380)"><g class="rise" fill="#C9A18A" style="animation-delay:2.6s"><use href="#heart"/></g></g>
<g transform="translate(630,380)"><g class="rise" fill="#E8D3C4" style="animation-delay:5.4s"><use href="#heart"/></g></g>
<g transform="translate(720,380)"><g class="rise" fill="#FFFFFF" style="animation-delay:1.3s"><use href="#heart"/></g></g>
<g transform="translate(820,380)"><g class="rise" fill="#C9A18A" style="animation-delay:3.9s"><use href="#heart"/></g></g>
<g transform="translate(60,60)"><g class="tw" fill="#FFFFFF" style="animation-delay:0s"><use href="#star"/></g></g>
<g transform="translate(190,120)"><g class="tw" fill="#FFFFFF" style="animation-delay:0.5s"><use href="#star"/></g></g>
<g transform="translate(300,40)"><g class="tw" fill="#FFFFFF" style="animation-delay:1.1s"><use href="#star"/></g></g>
<g transform="translate(420,90)"><g class="tw" fill="#FFFFFF" style="animation-delay:0.3s"><use href="#star"/></g></g>
<g transform="translate(560,50)"><g class="tw" fill="#FFFFFF" style="animation-delay:1.6s"><use href="#star"/></g></g>
<g transform="translate(690,100)"><g class="tw" fill="#FFFFFF" style="animation-delay:0.8s"><use href="#star"/></g></g>
<g transform="translate(830,60)"><g class="tw" fill="#FFFFFF" style="animation-delay:1.3s"><use href="#star"/></g></g>
<g transform="translate(90,300)"><g class="tw" fill="#FFFFFF" style="animation-delay:0.9s"><use href="#star"/></g></g>
<g transform="translate(250,330)"><g class="tw" fill="#FFFFFF" style="animation-delay:1.7s"><use href="#star"/></g></g>
<g transform="translate(620,330)"><g class="tw" fill="#FFFFFF" style="animation-delay:0.2s"><use href="#star"/></g></g>
<g transform="translate(760,250)"><g class="tw" fill="#FFFFFF" style="animation-delay:1.4s"><use href="#star"/></g></g>
<g transform="translate(480,320)"><g class="tw" fill="#FFFFFF" style="animation-delay:2.0s"><use href="#star"/></g></g>
<g transform="translate(40,-30)"><g class="fall" style="animation-delay:0.0s"><text class="tok" fill="#FFFFFF" text-anchor="middle">∑</text></g></g>
<g transform="translate(130,-30)"><g class="fall" style="animation-delay:0.8s"><text class="tok" fill="#E8D3C4" text-anchor="middle">π</text></g></g>
<g transform="translate(240,-30)"><g class="fall" style="animation-delay:1.6s"><text class="tok" fill="#FFFFFF" text-anchor="middle">√</text></g></g>
<g transform="translate(350,-30)"><g class="fall" style="animation-delay:2.4s"><text class="tok" fill="#E8D3C4" text-anchor="middle">∫</text></g></g>
<g transform="translate(450,-30)"><g class="fall" style="animation-delay:3.2s"><text class="tok" fill="#FFFFFF" text-anchor="middle">C++</text></g></g>
<g transform="translate(550,-30)"><g class="fall" style="animation-delay:4.0s"><text class="tok" fill="#E8D3C4" text-anchor="middle">py</text></g></g>
<g transform="translate(650,-30)"><g class="fall" style="animation-delay:4.8s"><text class="tok" fill="#FFFFFF" text-anchor="middle">∞</text></g></g>
<g transform="translate(740,-30)"><g class="fall" style="animation-delay:5.6s"><text class="tok" fill="#E8D3C4" text-anchor="middle">x²</text></g></g>
<g transform="translate(830,-30)"><g class="fall" style="animation-delay:6.4s"><text class="tok" fill="#FFFFFF" text-anchor="middle">{ }</text></g></g>
<g transform="translate(880,-30)"><g class="fall" style="animation-delay:7.2s"><text class="tok" fill="#E8D3C4" text-anchor="middle">&lt;/&gt;</text></g></g>

    <rect y="0" width="180" height="360" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" dur="6s" repeatCount="indefinite" keyTimes="0;0.55;1" values="-300;1200;1200"/></rect>
    <g class="bob" filter="url(#shadow)"><text x="450" y="140" text-anchor="middle" class="title">Hi, I am Yasmine ♡</text></g>
    <g clip-path="url(#t1)"><text x="450" y="232" text-anchor="middle" class="sub">CS Student @ Constructor</text></g>
    <g clip-path="url(#t2)"><text x="450" y="232" text-anchor="middle" class="sub">Building myself in tech ♡</text></g>
    <g clip-path="url(#t3)"><text x="450" y="232" text-anchor="middle" class="sub">Python • C/C++ • SQL • Maths</text></g>
    <text x="450" y="300" text-anchor="middle" class="tag">@yasminebasguit-pds  •  Germany  •  open to summer internships</text>
    <g transform="translate(818,285)"><g class="beat">
      <path d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#FFFFFF" transform="scale(3.2)"/>
      <rect x="-32" y="-11" width="26" height="17" rx="7" fill="#2E0F14"/><rect x="6" y="-11" width="26" height="17" rx="7" fill="#2E0F14"/>
      <path d="M-6,-5 H6" stroke="#2E0F14" stroke-width="3"/>
      <path class="shine" d="M-27,-7 L-19,-7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path class="shine" d="M11,-7 L19,-7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g></g>
    <rect class="ring" x="7" y="7" width="886" height="346" rx="26" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40">
  <style>.dash{animation:move 1.6s linear infinite}.h{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes move{to{stroke-dashoffset:-28}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}</style>

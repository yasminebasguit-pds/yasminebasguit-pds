  <line class="dash" x1="440" y1="20" x2="780" y2="20" stroke="#800020" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g transform="translate(400,20)"><path class="h" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#6B4226"/></g>

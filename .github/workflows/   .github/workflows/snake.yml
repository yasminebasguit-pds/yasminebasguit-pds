name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # relance toutes les 12 heures
  workflow_dispatch:          # permet de lancer a la main
  push:
    branches: [main]          # relance a chaque commit sur main

permissions:
  contents: write             # droit d'ecrire la branche output

concurrency:
  group: snake
  cancel-in-progress: true    # evite deux generations en meme temps

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#800020&color_dots=#ebedf0,#E8D3C4,#C9A18A,#9E2A45,#4A0E1A
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8D3C4&color_dots=#161b22,#4A0E1A,#800020,#B03A55,#E8A0B0

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
